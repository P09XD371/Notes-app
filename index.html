<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>H2O Tracker — Мой прогресс</title>
<style>
:root {
    --main-blue: #3a86ff;
    --light-blue: #e0f2fe;
    --bg: #f8fafc;
    --text: #1e293b;
    --card-bg: #ffffff;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 450px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    color: var(--main-blue);
}

.stats-label {
    margin-top: 8px;
    font-size: 16px;
    opacity: 0.8;
    cursor: pointer;
}

.progress-card {
    flex-grow: 1;
    background: var(--card-bg);
    border-radius: 35px;
    position: relative;
    overflow: hidden;
    margin-bottom: 25px;
    display: flex;
    align-items: flex-end;
}

.progress-fill {
    width: 100%;
    background: linear-gradient(180deg, #60a5fa 0%, var(--main-blue) 100%);
    transition: height 0.8s;
}

.percentage-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 64px;
    font-weight: 900;
}

.volume-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.volume-option {
    background: var(--card-bg);
    padding: 15px;
    border-radius: 20px;
    text-align: center;
    cursor: pointer;
}

.volume-option.active {
    border: 2px solid var(--main-blue);
    background: var(--light-blue);
}

.btn-add {
    background: var(--main-blue);
    color: white;
    border: none;
    width: 100%;
    padding: 20px;
    border-radius: 22px;
    font-size: 18px;
    font-weight: 700;
}

.btn-reset {
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
<header>
<h1>H2O Balance</h1>
<div class="stats-label" id="statsDisplay" onclick="changeGoal()">
Выпито: 0 / 2000 мл
</div>
</header>

<div class="progress-card">
<div class="percentage-display" id="percentNum">0%</div>
<div class="progress-fill" id="waterFill" style="height: 0%"></div>
</div>

<div class="volume-grid">
<div class="volume-option active" onclick="selectVol(250, this)">250 мл</div>
<div class="volume-option" onclick="selectVol(500, this)">500 мл</div>
<div class="volume-option" onclick="selectVol(1000, this)">1 л</div>
</div>

<button class="btn-add" onclick="addWater()">Добавить воду</button>
<button class="btn-reset" onclick="resetAll()">Сбросить прогресс</button>

</div>

<script>
let goal = parseInt(localStorage.getItem('h2o_goal')) || 2000;
let current = parseInt(localStorage.getItem('h2o_current')) || 0;
let selectedAmount = 250;

function changeGoal() {
    let val = prompt("Новая цель:", goal);
    if (val && !isNaN(val)) {
        goal = parseInt(val);
        localStorage.setItem('h2o_goal', goal);
        render();
    }
}

function selectVol(amount, el) {
    selectedAmount = amount;
    document.querySelectorAll('.volume-option').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
}

function addWater() {
    current += selectedAmount;
    render();
}

function resetAll() {
    current = 0;
    render();
}

function render() {
    const percent = Math.round((current / goal) * 100);
    document.getElementById('waterFill').style.height = Math.min(percent, 100) + '%';
    document.getElementById('percentNum').innerText = percent + '%';
    document.getElementById('statsDisplay').innerText = `Выпито: ${current} / ${goal} мл`;
    localStorage.setItem('h2o_current', current);
}

render();
</script>

</body>
</html>
